name: invalid — release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            cmake-args: -A x64 -DEXCEPTION_HANDLING=ON -DVULKAN=ON
            package-file: '*-win64.zip'
          - name: linux-x64
            os: ubuntu-latest
            cmake-args: -G Ninja
            package-file: '*-linux_x86_64.tar.xz'

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Prepare Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            cmake ninja-build pkg-config \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev \
            libfreetype6-dev libglew-dev libnotify-dev libpng-dev libsdl2-dev libsqlite3-dev \
            libx264-dev libwebsockets-dev

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.3.296.0
          cache: true

      - name: Build release
        shell: bash
        run: |
          mkdir -p release
          cd release
          cmake ${{ matrix.cmake-args }} -DCMAKE_BUILD_TYPE=Release \
            -DSERVER=OFF -DDOWNLOAD_GTEST=OFF -DGTEST_FOUND=OFF \
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=. ..
          cmake --build . --config Release --target game-client
          cmake --build . --config Release --target package_default

      - name: Show artifacts
        shell: bash
        run: ls -la release/${{ matrix.package-file }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/${{ matrix.package-file }}
          generate_release_notes: true

      - name: Upload artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: invalid-${{ matrix.name }}
          path: release/${{ matrix.package-file }}
          if-no-files-found: error
